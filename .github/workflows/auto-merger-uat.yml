name: Auto Merger (UAT: prod -> uat)

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_to_uat:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [uat]

    steps:
      - uses: actions/checkout@v4

      - name: Merge prod -> ${{ matrix.target }}
        uses: devmasx/merge-branch@master
        with:
          type: now
          from_branch: prod
          target_branch: ${{ matrix.target }}
          github_token: ${{ secrets.GH_AUTO_MERGER }}
